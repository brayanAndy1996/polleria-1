            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              examples:
                desactivado:
                  value:
                    id: 7
                    name: 'Ají'
                    category: sauce
                    priceCents: 0
                    isActive: false
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: >-
            Conflicto al guardar: ya existe un producto con ese nombre
            (PRODUCT_NAME_TAKEN, spec 005), el producto tiene presentaciones cargadas y
            se intentó cambiar su categoría fuera de 'chicken' (PRODUCT_HAS_PORTIONS,
            spec 006), el producto es un combo con componentes y se intentó cambiar su
            categoría fuera de 'combo' (PRODUCT_HAS_ITEMS, spec 007), o el producto es
            componente de algún combo y se intentó cambiar su categoría
