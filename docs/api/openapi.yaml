  /tables/{tableId}/join:
    post:
      operationId: joinTable
      tags:
        - tables
      summary: Suma la mesa a la cuenta de otra mesa
      description: >-
        Roles permitidos: waiter, admin. La mesa de la ruta se suma a la cuenta
        abierta de la mesa destino (intoTableId en el cuerpo). Si la mesa de la ruta
        está libre, simplemente queda cubierta por esa cuenta; si tiene su propia
        cuenta abierta, las dos cuentas se fusionan: el pedido de la mesa de la ruta
        queda 'merged' con su auditoría (quién y cuándo) y todas sus mesas pasan a la
        cuenta destino, que conserva sus marcas de listo y de cuenta. Unir es sumarse
        a una cuenta existente: la mesa destino debe existir y estar activa (sus
        problemas de dato van como issues en intoTableId; los de estado responden 409
        TABLE_INACTIVE o TABLE_HAS_NO_ORDER) y tener un pedido abierto — para crear
        una cuenta nueva está POST /tables/{tableId}/orders. La mesa de la ruta debe
        existir (404 TABLE_NOT_FOUND) y estar activa (409 TABLE_INACTIVE). Cabecera
        Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinTableRequest'
            example:
              intoTableId: 3
      responses:
        '200':
          description: >-
            El pedido destino, ya cubriendo también a la mesa de la ruta (y a todas
            las de la cuenta fusionada, si la hubo).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: >-
            La mesa de la ruta o la destino está desactivada (TABLE_INACTIVE), o la
            mesa destino no tiene un pedido abierto al que sumarse
            (TABLE_HAS_NO_ORDER). Nada quedó cambiado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                inactiva:
                  value:
                    error:
                      code: TABLE_INACTIVE
                      message: La mesa está desactivada.
                      details: null
                sin-cuenta:
                  value:
                    error:
                      code: TABLE_HAS_NO_ORDER
                      message: La mesa no tiene un pedido abierto.
                      details: null
        '500':
          $ref: '#/components/responses/InternalError'
  /tables/{tableId}/leave:
    post:
      operationId: leaveTable
      tags:
        - tables
      summary: Separa la mesa de su cuenta y la deja libre
      description: >-
        Roles permitidos: waiter, admin. Sin cuerpo. La mesa de la ruta deja de
        apuntar a su pedido y queda libre; el pedido sigue abierto con sus otras
        mesas. Si la mesa no tiene pedido responde 409 TABLE_HAS_NO_ORDER, y si es la
        última que cubre la cuenta responde 409 ORDER_NEEDS_TABLE — un pedido no
        puede quedar sin mesas: hay que cancelarlo o moverlo. Cabecera
        Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TableId'
      responses:
        '200':
          description: El pedido que quedó, sin la mesa separada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: >-
            La mesa no tiene pedido abierto (TABLE_HAS_NO_ORDER) o es la última que
            cubre la cuenta (ORDER_NEEDS_TABLE). Nada quedó cambiado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sin-cuenta:
                  value:
                    error:
                      code: TABLE_HAS_NO_ORDER
                      message: La mesa no tiene un pedido abierto.
                      details: null
                ultima-mesa:
                  value:
                    error:
                      code: ORDER_NEEDS_TABLE
                      message: El pedido necesita al menos una mesa; cancélalo o ciérralo.
                      details: null
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags:
        - orders
      summary: Un pedido con sus mesas, marcas y cierre
      description: >-
        Roles permitidos: cualquier rol con sesión. Devuelve el pedido completo:
        las mesas que lo cubren (tables sale vacía cuando ya terminó, porque ninguna
        lo apunta), quién lo abrió, las dos marcas de señal (readyAt y
        billRequestedAt, cada una con su hora o null) y cómo terminó (closedBy,
        cancelReason, mergedIntoOrderId). Un pedido nunca se borra: los cerrados,
        cancelados y fusionados se siguen leyendo con su status. Cabecera
        Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: El pedido indicado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}/move:
    post:
      operationId: moveOrder
      tags:
        - orders
      summary: Mueve el pedido completo a otra mesa
      description: >-
        Roles permitidos: waiter, admin. El pedido entero pasa a la mesa destino
        (tableId en el cuerpo): todas las mesas que cubría quedan libres y la
        destino queda cubierta. La mesa destino debe existir (su inexistencia va
        como issue en tableId), estar activa (409 TABLE_INACTIVE) y libre (409
        TABLE_OCCUPIED). Si la mesa destino ya es la única que cubre el pedido, la
        operación no hace nada y responde 200. El pedido debe existir (404
        ORDER_NOT_FOUND) y estar abierto (409 ORDER_NOT_OPEN). Cabecera
        Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveOrderRequest'
            example:
              tableId: 5
      responses:
        '200':
          description: El pedido, ya cubriendo solo a la mesa destino.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: >-
            El pedido ya está cerrado (ORDER_NOT_OPEN) o la mesa destino está
            ocupada (TABLE_OCCUPIED) o desactivada (TABLE_INACTIVE). Nada quedó
            cambiado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cerrado:
                  value:
                    error:
                      code: ORDER_NOT_OPEN
                      message: El pedido ya está cerrado.
                      details: null
                ocupada:
                  value:
                    error:
                      code: TABLE_OCCUPIED
                      message: La mesa ya tiene un pedido abierto.
                      details: null
                inactiva:
                  value:
                    error:
                      code: TABLE_INACTIVE
                      message: La mesa está desactivada.
                      details: null
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}/request-bill:
    post:
      operationId: requestOrderBill
      tags:
        - orders
      summary: Marca que la mesa pidió la cuenta
      description: >-
        Roles permitidos: waiter, admin. Sin cuerpo. Pone billRequestedAt (y quién la
        pidió) si no estaban; repetir es un no-op 200 que conserva la primera marca.
        La marca se limpia sola al cerrar, cancelar o fusionar el pedido — la spec
        010 la limpiará también al agregarse ítems nuevos. El pedido debe existir
        (404 ORDER_NOT_FOUND) y estar abierto (409 ORDER_NOT_OPEN). Cabecera
        Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: El pedido con su marca de cuenta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderNotOpen'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}/ready:
    post:
      operationId: markOrderReady
      tags:
        - orders
      summary: Marca el pedido como listo para servir
      description: >-
        Roles permitidos: waiter, kitchen, admin. Sin cuerpo. Pone readyAt (y quién
        avisó) si no estaban; repetir es un no-op 200 que conserva la primera marca —
        es la hora real en que cocina avisó. La señal puede convivir con la de la
        cuenta: cuando ambas están, el estado derivado de la mesa es ready. El pedido
        debe existir (404 ORDER_NOT_FOUND) y estar abierto (409 ORDER_NOT_OPEN).
        Cabecera Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: El pedido con su marca de listo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderNotOpen'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}/served:
    post:
      operationId: markOrderServed
      tags:
        - orders
      summary: Limpia la marca de listo al servir la mesa
      description: >-
        Roles permitidos: waiter, admin. Sin cuerpo. Quita readyAt (y quién avisó):
        la mesa se sirvió. Si el pedido no estaba listo, la operación es un no-op
        200 — sirve también para corregir un "listo" marcado por error. Un ready
        nuevo después vuelve a marcar (otra tanda lista). El pedido debe existir
        (404 ORDER_NOT_FOUND) y estar abierto (409 ORDER_NOT_OPEN). Cabecera
        Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: El pedido sin la marca de listo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderNotOpen'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      tags:
        - orders
      summary: Anula el pedido con motivo y libera sus mesas
      description: >-
        Roles permitidos: waiter, admin. Pasa el pedido a 'cancelled' con el motivo
        recortado (reason, de 1 a 200 caracteres, siempre obligatorio), quién lo
        anuló y cuándo, y libera todas las mesas que cubría en la misma transacción.
        El pedido nunca se borra: sigue leyéndose con su status y su auditoría. El
        pedido debe existir (404 ORDER_NOT_FOUND) y estar abierto (409
        ORDER_NOT_OPEN). Cabecera Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
            example:
              reason: El cliente se fue sin pedir.
      responses:
        '200':
          description: El pedido anulado; sus mesas ya están libres (tables vacía).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderNotOpen'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: polleria_session
      description: |
        Token de sesión aleatorio de 43 caracteres (base64url) que crea POST /auth/login. Cookie
        HttpOnly, SameSite=Strict, Path=/, Max-Age=57600, sin Secure (el local usa HTTP en la red).
  schemas:
    HealthStatus:
      type: string
      enum: [ok, error]
      description: ok si el componente responde; error si no.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, database, timestamp]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        database:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
          description: Hora del servidor en ISO 8601 UTC (con sufijo Z).
          examples: ['2026-10-07T20:00:00.000Z']
    UserRole:
      type: string
      enum: [waiter, kitchen, cashier, admin]
      description: Un rol. waiter = mozo, kitchen = cocina, cashier = cajero, admin = administrador.
    UserRoles:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items:
        $ref: '#/components/schemas/UserRole'
      description: |
        Roles de un usuario (revisión 1 de la spec 003): uno o varios, sin repetir. admin puede ir junto
        con otros roles. En las respuestas van siempre en el orden waiter, kitchen, cashier, admin.
      examples:
        - [waiter]
        - [waiter, cashier]
    Username:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{1,30}[a-z0-9]$'
      description: |
        Nombre de usuario guardado: de 3 a 32 caracteres, letras minúsculas sin tilde, números, punto,
        guion o guion bajo; empieza y termina con letra o número. Único.
      examples: [mozo.juan]
    Pin:
      type: string
      pattern: '^[0-9]{4,6}$'
      description: |
        PIN de 4 a 6 dígitos (texto, conserva los ceros a la izquierda). Nunca se devuelve.
        En las rutas de gestión (POST /users y POST /users/{userId}/pin, spec 004) además se
        rechazan los PIN fáciles de adivinar: dígitos repetidos, secuencias circulares
        ascendentes o descendentes (por ejemplo 1234, 4321, 9012, 0987), años entre 1900 y 2099,
        fechas DDMM o DDMMAA válidas y '2580'. El inicio de sesión no aplica esa regla.
      examples: ['2468']
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, pin]
      properties:
        username:
          type: string
          description: |
            Nombre de usuario tal como lo envía la web. La API lo recorta y lo pasa a minúsculas antes de
            validarlo contra el patrón de Username.
          examples: [mozo.juan]
        pin:
          $ref: '#/components/schemas/Pin'
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, roles]
      properties:
        id:
          type: integer
          minimum: 1
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Nombre que ve la gente (letras, números, espacios, punto, apóstrofo o guion).
          examples: [Juan]
        roles:
          $ref: '#/components/schemas/UserRoles'
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        expiresAt:
          type: string
          format: date-time
          description: Vencimiento de la sesión en ISO 8601 UTC (con sufijo Z); 16 horas después del inicio.
          examples: ['2026-10-09T07:00:00.000Z']
    LoginUser:
      type: object
      additionalProperties: false
      required: [username, displayName]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          type: string
          minLength: 1
          maxLength: 40
    LoginUsersResponse:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/LoginUser'
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, roles, isActive]
      description: Un usuario como lo ve el administrador (spec 004). Nunca incluye pin_hash.
      properties:
        id:
          type: integer
          minimum: 1
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Nombre que ve la gente (letras, números, espacios, punto, apóstrofo o guion).
          examples: [Rosa]
        roles:
          $ref: '#/components/schemas/UserRoles'
        isActive:
          type: boolean
          description: false = desactivado; no aparece en la lista de /auth/users y no puede iniciar sesión.
    UsersResponse:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, pin, roles]
      description: Alta de un usuario (spec 004). Nace activo.
      properties:
        username:
          type: string
          description: |
            Nombre de usuario tal como lo envía la web. La API lo recorta y lo pasa a minúsculas antes de
            validarlo contra el patrón de Username. No se puede cambiar después.
          examples: [rosa.cocina]
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Nombre que ve la gente. La API lo recorta y reduce espacios seguidos a uno.
          examples: [Rosa]
        pin:
          $ref: '#/components/schemas/Pin'
        roles:
          $ref: '#/components/schemas/UserRoles'
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Edición de un usuario (spec 004): al menos una propiedad. El nombre de usuario no se
        puede cambiar; el PIN se cambia solo por POST /users/{userId}/pin.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Nuevo nombre que ve la gente. La API lo recorta y reduce espacios seguidos a uno.
          examples: ['María P.']
        roles:
          $ref: '#/components/schemas/UserRoles'
        isActive:
          type: boolean
          description: false = desactivar (borra sus sesiones y limpia su conteo de intentos); true = reactivar (limpia el conteo).
    ResetPinRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin:
          $ref: '#/components/schemas/Pin'
    ProductCategory:
      type: string
      enum: [chicken, combo, dish, drink, dessert, sauce, extra]
      description: |
        Categoría de la carta, fija: chicken = pollo, combo = combo (spec 007: un producto
        compuesto con precio propio, como el mostrito), dish = plato, drink = bebida,
        dessert = postre, sauce = crema, extra = extra (por ejemplo descartables con
        precio). El orden del enum es también el orden de las categorías en la carta
        (los combos van inmediatamente después del pollo). Las etiquetas en español
        las pone la web.
      examples: [chicken]
    ProductName:
      type: string
      minLength: 1
      maxLength: 60
      pattern: '^[\p{L}\p{N}][\p{L}\p{M}\p{N} .,''()/%+-]*$'
      description: |
        Nombre visible del producto ya normalizado: de 1 a 60 caracteres; empieza con letra o
        número y puede llevar letras con tilde, números, espacios, punto, coma, apóstrofo,
        paréntesis, barra, porcentaje, más o guion (por ejemplo "1/4 de Pollo", "Inca Kola 1.5 L").
        La API recorta espacios y normaliza Unicode antes de validar. Único sin distinguir
        mayúsculas.
      examples: ['1/4 de Pollo']
    PriceCents:
      type: integer
      minimum: 0
      maximum: 99999
      description: |
        Precio en céntimos de sol como entero (S/ 18.50 = 1850): entre 0 y 99999
        (S/ 0.00 a S/ 999.99). Nunca float ni texto. 0 es válido (por ejemplo cremas gratis).
      examples: [1850]
    Product:
      type: object
      additionalProperties: false
      required: [id, name, category, priceCents, isActive]
      description: |
        Un producto de la carta (spec 005). Nunca incluye createdAt ni updatedAt.
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/ProductName'
        category:
          $ref: '#/components/schemas/ProductCategory'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        isActive:
          type: boolean
          description: false = desactivado; no está en la carta vigente pero sigue en la lista completa y puede reactivarse.
    ProductsResponse:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, category, priceCents]
      description: Alta de un producto de la carta (spec 005). Nace activo.
      properties:
        name:
          $ref: '#/components/schemas/ProductName'
        category:
          $ref: '#/components/schemas/ProductCategory'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Edición de un producto (spec 005): al menos una propiedad. isActive false lo quita de la
        carta (desactivar) y true lo devuelve (reactivar); un producto nunca se borra.
      properties:
        name:
          $ref: '#/components/schemas/ProductName'
        category:
          $ref: '#/components/schemas/ProductCategory'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        isActive:
          type: boolean
          description: false = desactivar (sale de la carta); true = reactivar.
    Portion:
      type: string
      enum: [eighth, quarter, half, whole]
      description: |
        Presentación del pollo (spec 006), fija: eighth = 1/8, quarter = 1/4, half = 1/2,
        whole = entero. El orden del enum es también el orden en que se muestran.
        Regla de dominio 1: consumen 1, 2, 4 y 8 octavos respectivamente.
      examples: [quarter]
    Cut:
      type: string
      enum: [breast, leg]
      description: |
        Parte del pollo (spec 006): breast = pecho, leg = pierna. Obligatoria en las
        presentaciones de una sola parte (eighth y quarter) y siempre null en half y
        whole, que llevan ambas partes.
      examples: [breast]
    ProductPortionInput:
      type: object
      additionalProperties: false
      required: [portion, priceCents]
      description: |
        Una fila del conjunto de presentaciones (PUT /products/{productId}/portions).
        cut es obligatorio (breast o leg) para eighth y quarter, y ausente o null para
        half y whole; otra combinación es 400 VALIDATION_ERROR.
      properties:
        portion:
          $ref: '#/components/schemas/Portion'
        cut:
          oneOf:
            - $ref: '#/components/schemas/Cut'
            - type: 'null'
          description: Obligatorio (breast o leg) en eighth y quarter; ausente o null en half y whole.
        priceCents:
          $ref: '#/components/schemas/PriceCents'
    ReplaceProductPortionsRequest:
      type: object
      additionalProperties: false
      required: [portions]
      description: |
        Conjunto completo de presentaciones de un producto 'chicken' (spec 006): de 0 a
        6 filas, sin repetir (portion, cut) — 400 con 'Hay presentaciones repetidas en
        la lista.'. La lista vacía deja el producto sin presentaciones.
      properties:
        portions:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ProductPortionInput'
    ProductPortion:
      type: object
      additionalProperties: false
      required: [id, productId, portion, cut, priceCents]
      description: |
        Una presentación ofrecida por un producto 'chicken' (spec 006). cut es null en
        half y whole. Nunca incluye createdAt ni updatedAt. El id no es estable entre
        PUTs (el conjunto se reemplaza borrando e insertando).
      properties:
        id:
          type: integer
          minimum: 1
        productId:
          type: integer
          minimum: 1
        portion:
          $ref: '#/components/schemas/Portion'
        cut:
          oneOf:
            - $ref: '#/components/schemas/Cut'
            - type: 'null'
          description: breast o leg en eighth y quarter; null en half y whole.
        priceCents:
          $ref: '#/components/schemas/PriceCents'
    ProductPortionsResponse:
      type: object
      additionalProperties: false
      required: [portions]
      properties:
        portions:
          type: array
          items:
            $ref: '#/components/schemas/ProductPortion'
    ComboItemInput:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      description: |
        Una fila del conjunto de componentes (PUT /products/{productId}/items, spec 007).
        productId referencia un producto existente que no sea 'combo'. Si el componente
        es 'chicken', portion es obligatoria y cut sigue la regla de la 006 (breast/leg
        en eighth y quarter; ausente o null en half y whole); si no lo es, portion y
        cut van ausentes o null — otra combinación es 400 VALIDATION_ERROR.
      properties:
        productId:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Producto componente. No puede ser un 'combo' (sin anidación) ni el propio combo.
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: Unidades del componente dentro del combo; en pollo multiplica sus octavos.
        portion:
          oneOf:
            - $ref: '#/components/schemas/Portion'
            - type: 'null'
          description: Obligatoria solo si el componente es 'chicken'; null en los demás.
        cut:
          oneOf:
            - $ref: '#/components/schemas/Cut'
            - type: 'null'
          description: breast o leg en eighth y quarter; null en half, whole y en componentes que no son pollo.
    ReplaceComboItemsRequest:
      type: object
      additionalProperties: false
      required: [items]
      description: |
        Conjunto completo de componentes de un producto 'combo' (spec 007): de 0 a 10
        filas, sin repetir (productId, portion, cut) — 400 con 'Hay componentes
        repetidos en la lista.'. La lista vacía deja el combo sin componentes.
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ComboItemInput'
    ComboItem:
      type: object
      additionalProperties: false
      required: [id, comboId, product, quantity, portion, cut]
      description: |
        Un componente de un combo (spec 007) con el producto embebido: su nombre,
        categoría, precio y estado se leen al momento (un componente desactivado llega
        con isActive false). portion y cut son null en componentes que no son pollo.
        Nunca incluye createdAt ni updatedAt. El id no es estable entre PUTs (el
        conjunto se reemplaza borrando e insertando).
      properties:
        id:
          type: integer
          minimum: 1
        comboId:
          type: integer
          minimum: 1
          description: Id del producto 'combo' dueño de la fila.
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        portion:
          oneOf:
            - $ref: '#/components/schemas/Portion'
            - type: 'null'
          description: Presentación del pollo del componente; null si no es 'chicken'.
        cut:
          oneOf:
            - $ref: '#/components/schemas/Cut'
            - type: 'null'
          description: breast o leg en eighth y quarter; null en half, whole y en componentes que no son pollo.
    ComboItemsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComboItem'
    TableName:
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^[\p{L}\p{M}\p{N} ._-]+$'
      description: |
        Nombre de la mesa ya normalizado: de 1 a 40 caracteres con letras (con
        tilde), marcas, números, espacios, punto, guion o guion bajo ("Mesa 1",
        "Barra", "T-2"). La API recorta los bordes, reduce los espacios seguidos a
        uno y normaliza Unicode antes de validar. Único sin distinguir mayúsculas,
        también entre mesas inactivas.
      examples: ['Mesa 3']
    TableState:
      type: string
      enum: [free, occupied, ready, bill_requested]
      description: |
        Estado de la mesa en el tablero, derivado del pedido que la cubre — nunca se
        guarda: free = libre, occupied = ocupada, ready = pedido listo,
        bill_requested = pidió la cuenta. Cuando el pedido tiene las dos marcas,
        ready gana (la interfaz puede destacar ambas leyendo el pedido embebido).
      examples: [occupied]
    OrderStatus:
      type: string
      enum: [open, closed, cancelled, merged]
      description: |
        Ciclo del pedido: open = cuenta abierta; closed = cobrada (el cobro llega en
        la Fase 4); cancelled = anulada con motivo; merged = fusionada en otra cuenta
        al unir mesas. Un pedido nunca se borra.
      examples: [open]
    UserRef:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: Referencia a un usuario dentro del pedido (su id y su nombre visible).
      properties:
        id:
          type: integer
          minimum: 1
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          examples: [Juan]
    TableRef:
      type: object
      additionalProperties: false
      required: [id, name]
      description: Referencia a una mesa dentro del pedido (su id y su nombre).
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          examples: ['Mesa 3']
    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - tables
        - openedBy
        - openedAt
        - readyAt
        - billRequestedAt
        - closedAt
        - closedBy
        - cancelReason
        - mergedIntoOrderId
      description: |
        Un pedido del salón (spec 009): exactamente estas once claves. tables son
        las mesas que lo cubren ahora — las que lo apuntan con current_order_id — y
        sale vacía cuando el pedido terminó. readyAt y billRequestedAt son las dos
        marcas de señal, en ISO o null; closedBy, cancelReason y mergedIntoOrderId
        cuentan cómo terminó (null mientras está abierto).
      properties:
        id:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/OrderStatus'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableRef'
          description: Mesas que cubre el pedido, por id.
        openedBy:
          $ref: '#/components/schemas/UserRef'
        openedAt:
          type: string
          format: date-time
          description: Cuándo se abrió la cuenta, en ISO 8601 UTC.
        readyAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Marca de "pedido listo"; null si no está marcado.
        billRequestedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Marca de "pidió la cuenta"; null si no está marcada.
        closedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Cuándo terminó la cuenta (cobro, anulación o fusión); null si sigue abierta.
        closedBy:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          description: Quién la cerró; null si sigue abierta.
        cancelReason:
          oneOf:
            - type: string
              maxLength: 200
            - type: 'null'
          description: Motivo recortado de la anulación; null si no fue anulada.
        mergedIntoOrderId:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: Id de la cuenta que la absorbió al fusionarse; null si no fue fusionada.
    Table:
      type: object
      additionalProperties: false
      required: [id, name, isActive, state, order]
      description: |
        Una mesa del salón tal como la devuelve la API: exactamente estas cinco
        claves. order embebe el pedido completo que la cubre, o null si está libre.
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/TableName'
        isActive:
          type: boolean
          description: false = desactivada; sigue en la lista y puede reactivarse, pero no admite operaciones.
        state:
          $ref: '#/components/schemas/TableState'
        order:
          oneOf:
            - $ref: '#/components/schemas/Order'
            - type: 'null'
          description: El pedido abierto que cubre la mesa; null si está libre.
    TablesResponse:
      type: object
      additionalProperties: false
      required: [tables]
      properties:
        tables:
          type: array
          items:
            $ref: '#/components/schemas/Table'
    CreateTableRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: Alta de una mesa del salón (spec 009). Siempre nace activa.
      properties:
        name:
          $ref: '#/components/schemas/TableName'
    UpdateTableRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Edición de una mesa (spec 009): al menos una propiedad. isActive false la
        desactiva (exige que no tenga pedido abierto) y true la reactiva; una mesa
        nunca se borra.
      properties:
        name:
          $ref: '#/components/schemas/TableName'
        isActive:
          type: boolean
          description: false = desactivar; true = reactivar.
    MoveOrderRequest:
      type: object
      additionalProperties: false
      required: [tableId]
      description: |
        Cuerpo de POST /orders/{orderId}/move: la mesa destino del pedido, una sola
        clave — cualquier otra forma (extra, arreglo o no objeto) sale como issue en
        tableId con 'El identificador de la mesa no es válido.', y una mesa
        inexistente sale como issue con 'Esa mesa no existe.'.
      properties:
        tableId:
          type: integer
          minimum: 1
          maximum: 2147483647
    JoinTableRequest:
      type: object
      additionalProperties: false
      required: [intoTableId]
      description: |
        Cuerpo de POST /tables/{tableId}/join: la mesa a cuya cuenta se suma la de
        la ruta, una sola clave. Mismas reglas que MoveOrderRequest, con issues en
        intoTableId; un destino igual a la mesa de la ruta sale como issue con
        'La mesa de destino debe ser otra.'.
      properties:
        intoTableId:
          type: integer
          minimum: 1
          maximum: 2147483647
    CancelOrderRequest:
      type: object
      additionalProperties: false
      required: [reason]
      description: |
        Cuerpo de POST /orders/{orderId}/cancel: solo el motivo, una sola clave —
        cualquier otra forma sale como issue en reason con 'Escribe el motivo de la
        anulación (hasta 200 caracteres).'.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Motivo de la anulación; la API lo recorta antes de medirlo.
    ErrorCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]*$'
      description: |
        Código estable para que la web decida qué hacer. Códigos definidos hasta la spec 005:
        - NOT_FOUND (404): la ruta no existe.
        - INVALID_JSON (400): el cuerpo no es un JSON válido.
        - INVALID_BODY (400): el cuerpo no se pudo leer (compresión corrupta o incompleta, solicitud cortada).
        - VALIDATION_ERROR (400): los datos no cumplen el esquema; details.issues lista los problemas.
          En las rutas de gestión también se usa para un PIN fácil (issue en pin, mensaje
          'Ese PIN es muy fácil de adivinar. Elige otro.') y para un userId de ruta no válido.
        - PAYLOAD_TOO_LARGE (413): el cuerpo supera 100 KB (medido después de descomprimir).
        - UNSUPPORTED_MEDIA_TYPE (415): Content-Encoding distinto de identity, gzip, deflate y br, o charset no soportado.
        - INTERNAL_ERROR (500): error no controlado; nunca incluye detalles internos.
        - INVALID_CREDENTIALS (401, spec 003): usuario inexistente, inactivo o PIN incorrecto (siempre el mismo mensaje).
        - UNAUTHENTICATED (401, spec 003): la ruta exige sesión y no hay una válida (sin cookie, token inválido, sesión vencida o usuario desactivado).
        - FORBIDDEN (403, spec 003): la sesión es válida pero ninguno de los roles del usuario tiene permiso.
        - TOO_MANY_ATTEMPTS (429, spec 003): usuario bloqueado por intentos fallidos; details.retryAfterSeconds.
        - USERNAME_TAKEN (409, spec 003): el nombre de usuario ya existe (activo o inactivo). Lo usa POST /users (spec 004).
        - USER_NOT_FOUND (404, spec 004): el userId de la ruta no corresponde a ningún usuario.
        - LAST_ADMIN_REQUIRED (409, spec 004): la operación dejaría el sistema sin administradores activos.
        - PRODUCT_NOT_FOUND (404, spec 005): el productId de la ruta no corresponde a ningún producto.
        - PRODUCT_NAME_TAKEN (409, spec 005): ya existe un producto con ese nombre, sin distinguir
          mayúsculas, activo o inactivo. Lo usan POST /products y PATCH /products/{productId}.
        - PORTIONS_NOT_ALLOWED (409, spec 006): solo los productos de la categoría Pollo pueden
          tener presentaciones. Lo usa PUT /products/{productId}/portions.
        - PRODUCT_HAS_PORTIONS (409, spec 006): el producto tiene presentaciones cargadas y se
          intentó cambiar su categoría fuera de 'chicken'. Lo usa PATCH /products/{productId}.
        - COMBO_ITEMS_NOT_ALLOWED (409, spec 007): solo los productos de la categoría Combos
          pueden tener componentes. Lo usa PUT /products/{productId}/items.
        - PRODUCT_HAS_ITEMS (409, spec 007): el producto es un combo con componentes y se
          intentó cambiar su categoría fuera de 'combo'. Lo usa PATCH /products/{productId}.
        - PRODUCT_IS_COMPONENT (409, spec 007): el producto es componente de algún combo y se
          intentó cambiar su categoría. Lo usa PATCH /products/{productId}.
        - TABLE_NOT_FOUND (404, spec 009): el tableId de la ruta no corresponde a ninguna mesa.
        - TABLE_NAME_TAKEN (409, spec 009): ya existe una mesa con ese nombre, sin
          distinguir mayúsculas, activa o inactiva. Lo usan POST /tables y PATCH /tables/{tableId}.
        - TABLE_OCCUPIED (409, spec 009): la mesa ya tiene un pedido abierto; al abrir
          cuenta sobre una cubierta o al mover un pedido a una mesa ocupada por otra cuenta.
        - TABLE_INACTIVE (409, spec 009): la mesa está desactivada y no admite abrir
          cuenta, mover a ella ni participar en una unión.
        - TABLE_HAS_OPEN_ORDER (409, spec 009): la mesa tiene un pedido abierto y se
          intentó desactivarla. Lo usa PATCH /tables/{tableId}.
        - TABLE_HAS_NO_ORDER (409, spec 009): la mesa no tiene un pedido abierto; al
          separar una libre o cuando el destino de una unión no tiene cuenta.
        - ORDER_NOT_FOUND (404, spec 009): el orderId de la ruta no corresponde a ningún pedido.
        - ORDER_NOT_OPEN (409, spec 009): el pedido ya está cerrado (cobrado, anulado o
          fusionado) y la operación solo corre sobre pedidos abiertos.
        - ORDER_NEEDS_TABLE (409, spec 009): la operación dejaría el pedido sin ninguna
          mesa; al separar la última que lo cubre.
        Las specs siguientes agregan códigos propios. Los clientes deben tolerar códigos desconocidos.
      examples: [NOT_FOUND]
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
          description: Ruta del campo con partes unidas por punto (por ejemplo items.0.quantity). Vacío si el problema es del cuerpo completo.
          examples: [name]
        message:
          type: string
          minLength: 1
          description: Explicación en español.
    ErrorDetails:
      description: |
        Información adicional del error, o null si no hay. En VALIDATION_ERROR es { issues }; en
        TOO_MANY_ATTEMPTS es { retryAfterSeconds }.
      oneOf:
        - type: 'null'
        - type: object
          additionalProperties: true
          properties:
            issues:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
            retryAfterSeconds:
              type: integer
              minimum: 1
              maximum: 900
              description: Segundos que faltan para que termine el bloqueo, redondeados hacia arriba.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              minLength: 1
              description: Mensaje en español de Perú, listo para mostrar al usuario.
            details:
              $ref: '#/components/schemas/ErrorDetails'
  headers:
    CacheControlNoStore:
      description: La respuesta no se guarda en caché.
      schema:
        type: string
        const: no-store
    SetSessionCookie:
      description: |
        Crea la cookie de sesión: polleria_session=<token de 43 caracteres>; Max-Age=57600; Path=/;
        Expires=<fecha>; HttpOnly; SameSite=Strict. Sin Secure ni Domain.
      schema:
        type: string
      example: polleria_session=Q2hpY2hhTW9yYWRhQ29uUG9sbG9BTGFCcmFzYTEyMzQ; Max-Age=57600; Path=/; Expires=Fri, 09 Oct 2026 07:00:00 GMT; HttpOnly; SameSite=Strict
    ClearSessionCookie:
      description: Borra la cookie de sesión (valor vacío y fecha en el pasado).
      schema:
        type: string
      example: polleria_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Strict
    RetryAfter:
      description: Segundos que faltan para poder intentar de nuevo (igual a details.retryAfterSeconds).
      schema:
        type: integer
        minimum: 1
        maximum: 900
      example: 900
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: |
        Identificador del usuario: solo dígitos, entero entre 1 y 2147483647 (entero de la base).
        Si no cumple, la ruta responde 400 VALIDATION_ERROR con un issue en 'userId'.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 3
    ProductId:
      name: productId
      in: path
      required: true
      description: |
        Identificador del producto: solo dígitos, entero entre 1 y 2147483647 (entero de la base).
        Si no cumple, la ruta responde 400 VALIDATION_ERROR con un issue en 'productId'
        (mensaje 'El identificador del producto no es válido.').
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 5
    TableId:
      name: tableId
      in: path
      required: true
      description: |
        Identificador de la mesa: solo dígitos, entero entre 1 y 2147483647 (entero
        de la base). Si no cumple, la ruta responde 400 VALIDATION_ERROR con un
        issue en 'tableId' (mensaje 'El identificador de la mesa no es válido.').
        Un percent-encoding malformado en la dirección responde el mismo error.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 3
    OrderId:
      name: orderId
      in: path
      required: true
      description: |
        Identificador del pedido: solo dígitos, entero entre 1 y 2147483647 (entero
        de la base). Si no cumple, la ruta responde 400 VALIDATION_ERROR con un
        issue en 'orderId' (mensaje 'El identificador del pedido no es válido.').
        Un percent-encoding malformado en la dirección responde el mismo error.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 12
  responses:
    InvalidJson:
      description: El cuerpo de la solicitud no es un JSON válido. Aplica a cualquier ruta que reciba cuerpo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_JSON
              message: El cuerpo de la solicitud no es un JSON válido.
              details: null
    InvalidBody:
      description: |
        El cuerpo de la solicitud no se pudo leer: la compresión (gzip, deflate o br) está corrupta,
        incompleta o vacía, o la solicitud se cortó antes de terminar el cuerpo. Aplica a cualquier ruta
        que reciba cuerpo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_BODY
              message: No se pudo leer el cuerpo de la solicitud.
              details: null
    UnsupportedMediaType:
      description: |
        La codificación del cuerpo no es compatible: Content-Encoding distinto de identity, gzip, deflate
        y br (también varias codificaciones a la vez), o un charset que no es UTF o que no existe.
        Aplica a cualquier ruta que reciba cuerpo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: La codificación del cuerpo de la solicitud no es compatible.
              details: null
    ValidationError:
      description: Los datos enviados no cumplen el esquema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Los datos enviados no son válidos.
              details:
                issues:
                  - path: name
                    message: Debe tener al menos 1 carácter.
    NotFound:
      description: La ruta solicitada no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: La ruta solicitada no existe.
              details: null
    PayloadTooLarge:
      description: El cuerpo de la solicitud supera 100 KB (medido después de descomprimir).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: La solicitud es demasiado grande.
              details: null
    InvalidCredentials:
      description: |
        Usuario inexistente, usuario inactivo o PIN incorrecto. El cuerpo es siempre el mismo para no
        revelar la causa. No crea sesión ni envía Set-Cookie.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_CREDENTIALS
              message: Usuario o PIN incorrecto.
              details: null
    Unauthenticated:
      description: |
        La ruta exige sesión y no hay una válida: sin cookie, token inexistente o mal formado, sesión
        vencida o usuario desactivado. La web vuelve a /login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: Debes iniciar sesión para continuar.
              details: null
    Forbidden:
      description: |
        La sesión es válida pero ninguno de los roles del usuario tiene permiso para esta operación
        (requireRole). La usan las rutas /users (solo admin) y las escrituras de /products
        (POST y PATCH, y PUT de presentaciones y de componentes, solo admin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: No tienes permiso para realizar esta acción.
              details: null
    TooManyAttempts:
      description: |
        El usuario está bloqueado por intentos fallidos. Responde así aunque el PIN sea correcto, hasta
        que pasen los segundos indicados. No envía Set-Cookie.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOO_MANY_ATTEMPTS
              message: Demasiados intentos fallidos. Espera unos minutos e intenta de nuevo.
              details:
                retryAfterSeconds: 900
    InternalError:
      description: Error no controlado. No incluye el mensaje interno ni la traza.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Ocurrió un error inesperado. Intenta nuevamente.
              details: null
    UsernameTaken:
      description: El nombre de usuario ya existe, en un usuario activo o inactivo (spec 004).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: USERNAME_TAKEN
              message: Ese nombre de usuario ya existe.
              details: null
    UserNotFound:
      description: El userId de la ruta no corresponde a ningún usuario (spec 004).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: USER_NOT_FOUND
              message: Ese usuario no existe.
              details: null
    LastAdminRequired:
      description: |
        La operación dejaría el sistema sin administradores activos: quitar el rol admin del
        último administrador activo o desactivarlo (spec 004). El usuario queda sin cambios.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: LAST_ADMIN_REQUIRED
              message: Debe quedar al menos un administrador activo.
              details: null
    ProductNotFound:
      description: El productId de la ruta no corresponde a ningún producto (spec 005).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PRODUCT_NOT_FOUND
              message: Ese producto no existe.
              details: null
    ProductNameTaken:
      description: |
        Ya existe un producto con ese nombre, sin distinguir mayúsculas, activo o inactivo
        (spec 005). Nada quedó creado ni modificado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PRODUCT_NAME_TAKEN
              message: Ya existe un producto con ese nombre.
              details: null
    PortionsNotAllowed:
      description: |
        Solo los productos de la categoría Pollo (chicken) pueden tener presentaciones
        (spec 006). Lo responde PUT /products/{productId}/portions sobre un producto de
        otra categoría. Nada quedó creado ni modificado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PORTIONS_NOT_ALLOWED
              message: Solo los productos de la categoría Pollo pueden tener presentaciones.
              details: null
    ProductHasPortions:
      description: |
        El producto tiene presentaciones cargadas y se intentó cambiar su categoría a algo
        distinto de 'chicken' (spec 006). Lo responde PATCH /products/{productId}. Primero
        hay que quitar las presentaciones (PUT .../portions con lista vacía). El producto
        queda sin cambios.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PRODUCT_HAS_PORTIONS
              message: Este producto tiene presentaciones de pollo; quítalas antes de cambiar su categoría.
              details: null
    ComboItemsNotAllowed:
      description: |
        Solo los productos de la categoría Combos (combo) pueden tener componentes
        (spec 007). Lo responde PUT /products/{productId}/items sobre un producto de
        otra categoría. Nada quedó creado ni modificado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: COMBO_ITEMS_NOT_ALLOWED
              message: Solo los productos de la categoría Combos pueden tener componentes.
              details: null
    ProductHasItems:
      description: |
        El producto es un combo con componentes y se intentó cambiar su categoría a algo
        distinto de 'combo' (spec 007). Lo responde PATCH /products/{productId}. Primero
        hay que vaciar los componentes (PUT .../items con items vacío). El producto
        queda sin cambios.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PRODUCT_HAS_ITEMS
              message: Este producto es un combo con componentes; quita sus componentes antes de cambiar su categoría.
              details: null
    ProductIsComponent:
      description: |
        El producto es componente de algún combo y se intentó cambiar su categoría
        (spec 007). Lo responde PATCH /products/{productId}. Primero hay que quitarlo
        del combo con PUT .../items del combo dueño. El producto queda sin cambios.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PRODUCT_IS_COMPONENT
              message: Este producto es componente de un combo; quítalo del combo antes de cambiar su categoría.
              details: null
    TableNotFound:
      description: El tableId de la ruta no corresponde a ninguna mesa (spec 009).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TABLE_NOT_FOUND
              message: Esa mesa no existe.
              details: null
    OrderNotFound:
      description: El orderId de la ruta no corresponde a ningún pedido (spec 009).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ORDER_NOT_FOUND
              message: Ese pedido no existe.
              details: null
    TableNameTaken:
      description: |
        Ya existe una mesa con ese nombre, sin distinguir mayúsculas, activa o
        inactiva (spec 009). Lo usan POST /tables y PATCH /tables/{tableId}. Nada
        quedó creado ni modificado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TABLE_NAME_TAKEN
              message: Ya existe una mesa con ese nombre.
              details: null
    TableOccupied:
      description: |
        La mesa ya tiene un pedido abierto (spec 009): al abrir una cuenta sobre una
        mesa cubierta (POST /tables/{tableId}/orders) o al mover un pedido a una
        mesa ocupada por otra cuenta (POST /orders/{orderId}/move). Nada quedó
        cambiado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TABLE_OCCUPIED
              message: La mesa ya tiene un pedido abierto.
              details: null
    TableInactive:
      description: |
        La mesa está desactivada (spec 009): no admite abrir cuenta, ser destino de
        un movimiento ni participar en una unión, esté en la ruta o en el cuerpo.
        Primero hay que reactivarla. Nada quedó cambiado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TABLE_INACTIVE
              message: La mesa está desactivada.
              details: null
    TableHasOpenOrder:
      description: |
        La mesa tiene un pedido abierto y se intentó desactivarla con PATCH
        /tables/{tableId} (spec 009): primero hay que moverlo o cerrarlo. La mesa
        queda sin cambios.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TABLE_HAS_OPEN_ORDER
              message: La mesa tiene un pedido abierto; ciérralo o muévelo antes de desactivarla.
              details: null
    TableHasNoOrder:
      description: |
        La mesa no tiene un pedido abierto (spec 009): al separar una mesa libre
        (POST /tables/{tableId}/leave) o cuando la mesa destino de una unión no
        tiene cuenta a la que sumarse (POST /tables/{tableId}/join). Nada quedó
        cambiado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TABLE_HAS_NO_ORDER
              message: La mesa no tiene un pedido abierto.
              details: null
    OrderNotOpen:
      description: |
        El pedido ya está cerrado — cobrado, anulado o fusionado — y la operación
        solo corre sobre pedidos abiertos (spec 009): mover, unir por fusión,
        separar, señales y cancelar. Nada quedó cambiado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ORDER_NOT_OPEN
              message: El pedido ya está cerrado.
              details: null
    OrderNeedsTable:
      description: |
        La operación dejaría el pedido sin ninguna mesa (spec 009): separar la
        última mesa que lo cubre (POST /tables/{tableId}/leave). Un pedido no puede
        quedar sin mesas por esta vía: hay que cancelarlo o moverlo entero.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ORDER_NEEDS_TABLE
              message: El pedido necesita al menos una mesa; cancélalo o ciérralo.
              details: null
