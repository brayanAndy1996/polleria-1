        mayúsculas, activo o inactivo) responde 409 PRODUCT_NAME_TAKEN. Editar el precio no
        altera pedidos ya registrados: en la Fase 2 cada ítem copia el precio vigente al
        agregarse. Desde la spec 006: cambiar la categoría a algo distinto de 'chicken' en
        un producto que tiene presentaciones cargadas responde 409 PRODUCT_HAS_PORTIONS
        (primero se quitan las presentaciones con PUT .../portions y portions vacío).
        Desde la spec 007: cambiar la categoría a algo distinto de 'combo' en un combo
        con componentes responde 409 PRODUCT_HAS_ITEMS (primero se vacía con PUT
        .../items e items vacío), y cambiar la categoría de un producto que es
        componente de algún combo responde 409 PRODUCT_IS_COMPONENT (primero se quita
        del combo). Cabecera Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
