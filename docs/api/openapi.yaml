openapi: 3.1.0
info:
  title: Sistema Pollería API
  version: 0.5.0
  summary: Contrato entre la web (apps/web) y la API (apps/api) del Sistema Pollería.
  description: |
    Fuente de verdad entre frontend y backend. Cada spec en docs/specs/ agrega aquí sus endpoints.

    Convenciones (spec 001):
    - Todas las rutas de la API cuelgan del prefijo /api. La web (puerto 3000) reenvía /api/* a la API
      (puerto 4000) en el mismo origen, así el navegador nunca habla directo con la API.
    - Los nombres de campos van en inglés y en camelCase, según el glosario de CLAUDE.md.
    - Dinero en céntimos de sol como entero, con sufijo Cents (por ejemplo priceCents).
    - Pollo en octavos como entero, con sufijo Eighths (por ejemplo stockEighths).
    - Fechas en ISO 8601 en UTC con sufijo Z. Los cálculos de día, cierre y reportes usan America/Lima.
    - Errores con el formato común ErrorResponse: { error: { code, message, details } }.
      code va en inglés en MAYÚSCULAS_CON_GUION_BAJO; message va en español de Perú para mostrarse al usuario.
    - Excepción documentada: GET /health responde 503 con HealthResponse (no con ErrorResponse) porque
      informa un estado del sistema, no un error de la solicitud.
    - Errores al leer el cuerpo (spec 001, enmienda 1): cualquier solicitud con cuerpo puede recibir
      400 INVALID_JSON, 400 INVALID_BODY, 413 PAYLOAD_TOO_LARGE o 415 UNSUPPORTED_MEDIA_TYPE, aunque la
      operación no los repita. El cuerpo puede venir comprimido con gzip, deflate o br; el límite de
      100 KB se mide después de descomprimir. Solo se acepta un charset UTF (utf-8 por defecto).

    Autenticación (spec 003):
    - La sesión viaja en la cookie httpOnly polleria_session (esquema de seguridad sessionCookie). La
      crea POST /auth/login y la borra POST /auth/logout. Es un token aleatorio; la API guarda solo su
      SHA-256. Dura 16 horas desde que se inicia, sin renovación.
    - Rutas públicas: /health, /auth/users, /auth/login y /auth/logout. Toda otra ruta exige sesión:
      sin sesión válida responde 401 UNAUTHENTICATED; con sesión pero sin ninguno de los roles
      permitidos, 403 FORBIDDEN. Basta con tener uno de los roles permitidos. Cada operación protegida
      indica en su descripción los roles permitidos; admin pasa solo si la operación lo incluye.
    - Todas las respuestas de /auth/* llevan Cache-Control: no-store, también las de error.
    - Roles: waiter (mozo), kitchen (cocina), cashier (cajero) y admin (administrador). Un usuario
      tiene uno o varios roles, sin repetir (versión 0.3.1, revisión 1 de la spec 003). La API los
      devuelve siempre en el orden waiter, kitchen, cashier, admin.

    Gestión de usuarios (spec 004):
    - Las rutas /users solo las usa el rol admin: listar todos los usuarios, crear uno, editar el
      nombre visible, los roles y el estado activo, y restablecer el PIN. Todas las respuestas de
      /users/* llevan Cache-Control: no-store, también las de error.
    - Desactivar a un usuario o restablecer su PIN borra sus sesiones y limpia su conteo de
      intentos de inicio de sesión. Ninguna operación puede dejar el sistema sin al menos un
      administrador activo (409 LAST_ADMIN_REQUIRED). El nombre de usuario no se puede cambiar;
      el PIN no se cambia por PATCH, tiene su propia ruta.
    - El PIN de un usuario nuevo o restablecido, además del formato ^[0-9]{4,6}$, no puede ser
      fácil de adivinar (dígitos repetidos, secuencias circulares ascendentes o descendentes,
      años entre 1900 y 2099, fechas DDMM o DDMMAA válidas ni '2580'): 400 VALIDATION_ERROR.
      El inicio de sesión no aplica esa regla: un PIN débil creado antes sigue sirviendo.

    Carta de productos y precios (spec 005):
    - /products es la carta: productos con nombre, categoría fija, precio en céntimos de sol
      (priceCents, entero entre 0 y 99999) y estado activo. GET /products la puede leer cualquier
      rol con sesión y devuelve todos los productos, activos e inactivos, en el orden de la
      carta (categoría, luego nombre); quien muestra la carta vigente filtra por isActive.
    - Solo el rol admin crea (POST /products) y edita, desactiva o reactiva (PATCH
      /products/{productId}). Un producto nunca se borra: se desactiva con isActive false.
      El nombre es único sin distinguir mayúsculas (409 PRODUCT_NAME_TAKEN).
    - Todas las respuestas de /products/* llevan Cache-Control: no-store, también las de error.
servers:
  - url: http://localhost:3000/api
    description: A través de la web, en el mismo origen. Es lo que usan los navegadores (PC de caja y celulares).
  - url: http://127.0.0.1:4000/api
    description: API directa. Solo accesible desde la misma PC (HOST=127.0.0.1 por defecto).
tags:
  - name: system
    description: Estado del sistema.
  - name: auth
    description: Inicio de sesión con usuario y PIN, sesión actual y cierre de sesión (spec 003).
  - name: users
    description: Gestión de usuarios por el administrador (spec 004).
  - name: products
    description: Carta de productos y precios (spec 005).
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Estado de la API y de la base de datos
      description: |
        Público (no requiere sesión, tampoco cuando exista autenticación).
        Verifica la base de datos con una consulta trivial y un tiempo límite de 2 segundos.
        Nunca incluye la URL de la base, el usuario, la clave, el host ni el mensaje del driver.
      security: []
      responses:
        '200':
          description: La API y la base de datos responden.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                database: ok
                timestamp: '2026-10-07T20:00:00.000Z'
        '503':
          description: La API responde, pero la base de datos no responde o tardó más de 2 segundos.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: error
                database: error
                timestamp: '2026-10-07T20:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/users:
    get:
      tags: [auth]
      operationId: listLoginUsers
      summary: Usuarios activos para la pantalla de inicio de sesión
      description: |
        Público: la pantalla /login muestra un botón por usuario para tocar su nombre en lugar de
        escribirlo. Devuelve solo usuarios activos, ordenados por displayName en español sin distinguir
        mayúsculas ni tildes (los empates, por username). Nunca incluye id, roles, estado ni nada del PIN.
        Cada usuario aparece una sola vez, tenga los roles que tenga.
      security: []
      responses:
        '200':
          description: Lista de usuarios activos (puede estar vacía).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUsersResponse'
              example:
                users:
                  - username: caja.ana
                    displayName: Ana
                  - username: mozo.juan
                    displayName: Juan
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión con usuario y PIN
      description: |
        Público. Si el usuario existe, está activo y el PIN es correcto, crea una sesión de 16 horas,
        la envía en la cookie polleria_session y responde los datos del usuario.

        - El username se recorta y se pasa a minúsculas antes de validar.
        - Usuario inexistente, usuario inactivo o PIN incorrecto responden el mismo 401
          INVALID_CREDENTIALS.
        - Después de 5 intentos fallidos seguidos de un mismo usuario, ese usuario queda bloqueado
          15 minutos (429 TOO_MANY_ATTEMPTS, aunque el PIN sea correcto). Después del primer bloqueo,
          cada intento fallido vuelve a bloquearlo 15 minutos; un inicio de sesión exitoso borra el
          conteo. Los errores 400 no cuentan como intentos.
        - Un inicio de sesión exitoso borra las sesiones vencidas de cualquier usuario.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: mozo.juan
              pin: '2468'
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                user:
                  id: 3
                  username: mozo.juan
                  displayName: Juan
                  roles: [waiter]
                expiresAt: '2026-10-09T07:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentSession
      summary: Sesión actual
      description: |
        Roles: cualquiera con sesión válida (waiter, kitchen, cashier, admin).
        Devuelve el usuario con sus datos actuales (roles y nombre leídos de la base en cada solicitud;
        roles en el orden waiter, kitchen, cashier, admin) y el vencimiento de la sesión. La web lo usa
        para decidir qué áreas mostrar.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: La sesión es válida.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                user:
                  id: 4
                  username: moza.rosa
                  displayName: Rosa
                  roles: [waiter, cashier]
                expiresAt: '2026-10-09T07:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar sesión en este dispositivo
      description: |
        Público e idempotente: si la cookie trae una sesión, la borra; con o sin sesión responde 204 y
        borra la cookie. Solo cierra la sesión de este dispositivo; las demás sesiones del mismo usuario
        siguen. No lleva cuerpo.
      security: []
      responses:
        '204':
          description: Sesión cerrada (o no había sesión). La cookie queda borrada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      operationId: listUsers
      tags:
        - users
      summary: Lista todos los usuarios
      description: >-
        Roles permitidos: admin. Devuelve todos los usuarios, activos e inactivos, ordenados por
        displayName en orden alfabético insensible a mayúsculas (es-PE) y, si coinciden, por
        username. Nunca incluye pin_hash. Cabecera Cache-Control: no-store.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Lista de usuarios (puede estar vacía)
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
              examples:
                respuesta:
                  value:
                    users:
                      - id: 2
                        username: 'maria'
                        displayName: 'María'
                        roles:
                          - admin
                        isActive: true
                      - id: 4
                        username: 'rosa'
                        displayName: 'Rosa'
                        roles:
                          - cashier
                        isActive: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createUser
      tags:
        - users
      summary: Crea un usuario
      description: >-
        Roles permitidos: admin. Crea un usuario activo con el nombre visible, el PIN inicial y
        uno o varios roles del cuerpo. Los PIN fáciles se rechazan con 400 VALIDATION_ERROR
        (detalle en ErrorCode). El PIN nunca se devuelve ni se muestra: solo el administrador lo
        conoce y se lo comunica al trabajador. Cabecera Cache-Control: no-store.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              cocinera-cajera:
                value:
                  username: 'rosa.cocina'
                  displayName: 'Rosa'
                  pin: '3968'
                  roles:
                    - kitchen
                    - cashier
      responses:
        '201':
          description: Usuario creado
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
              examples:
                respuesta:
                  value:
                    id: 6
                    username: 'rosa.cocina'
                    displayName: 'Rosa'
                    roles:
                      - kitchen
                      - cashier
                    isActive: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/UsernameTaken'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}:
    patch:
      operationId: updateUser
      tags:
        - users
      summary: Edita nombre visible, roles o estado de un usuario
      description: >-
        Roles permitidos: admin. Cambia el nombre visible (displayName), los roles (el conjunto
        completo, sin repetir) o el estado (isActive) del usuario indicado por userId, con al
        menos una propiedad en el cuerpo. El nombre de usuario no se puede cambiar y el PIN se
        cambia solo por POST /users/{userId}/pin. Al desactivar (isActive false) se borran las
        sesiones del usuario y se limpia su conteo de intentos; al reactivar (isActive true) se
        limpia el conteo. Ninguna operación puede dejar el sistema sin al menos un administrador
        activo. Un administrador puede quitarse su propio rol admin o desactivarse siempre que
        quede otro administrador activo; con eso sus sesiones dejan de servir desde la siguiente
        solicitud. Cabecera Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              desactivar:
                value:
                  isActive: false
              nombre-y-roles:
                value:
                  displayName: 'María P.'
                  roles:
                    - waiter
                    - cashier
      responses:
        '200':
          description: Usuario actualizado
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
              examples:
                desactivado:
                  value:
                    id: 4
                    username: 'rosa'
                    displayName: 'Rosa'
                    roles:
                      - cashier
                    isActive: false
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/LastAdminRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}/pin:
    post:
      operationId: resetUserPin
      tags:
        - users
      summary: Restablece el PIN de un usuario
      description: >-
        Roles permitidos: admin. Cambia el PIN del usuario indicado por userId por el del cuerpo
        (no puede ser fácil; el PIN anterior nunca se muestra ni se devuelve). Borra las
        sesiones del usuario —incluida la del administrador si se restablece el PIN a sí mismo—
        y limpia su conteo de intentos. El administrador puede restablecer el PIN de usuarios
        inactivos, que siguen sin poder iniciar sesión hasta reactivarse. Cabecera
        Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPinRequest'
            examples:
              ejemplo:
                value:
                  pin: '7395'
      responses:
        '204':
          description: PIN restablecido (sin cuerpo)
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /products:
    get:
      operationId: listProducts
      tags:
        - products
      summary: Lista la carta completa
      description: >-
        Roles permitidos: cualquier rol con sesión (waiter, kitchen, cashier, admin). Devuelve
        todos los productos, activos e inactivos, en el orden de la carta: por categoría en el
        orden de ProductCategory, dentro de cada categoría por nombre en orden alfabético
        insensible a mayúsculas (es-PE) y, si coinciden, por id. Quien muestra la carta vigente
        (el mozo en la Fase 2) filtra por isActive; la administración muestra todos para poder
        reactivarlos. Cada producto lleva exactamente id, name, category, priceCents e isActive;
        nunca createdAt ni updatedAt. Cabecera Cache-Control: no-store.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Carta de productos (puede estar vacía)
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsResponse'
              examples:
                respuesta:
                  value:
                    products:
                      - id: 5
                        name: '1/4 de Pollo'
                        category: chicken
                        priceCents: 1850
                        isActive: true
                      - id: 2
                        name: 'Chicha Morada'
                        category: drink
                        priceCents: 500
                        isActive: true
                      - id: 7
                        name: 'Ají'
                        category: sauce
                        priceCents: 0
                        isActive: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProduct
      tags:
        - products
      summary: Crea un producto de la carta
      description: >-
        Roles permitidos: admin. Crea un producto activo con el nombre, la categoría y el precio
        en céntimos del cuerpo. El nombre se recorta y debe ser único sin distinguir mayúsculas
        entre todos los productos (activos o inactivos): si ya existe responde 409
        PRODUCT_NAME_TAKEN. El precio es un entero de céntimos entre 0 y 99999 (S/ 0.00 a
        S/ 999.99); 0 es válido (por ejemplo cremas que no se cobran). Cabecera
        Cache-Control: no-store.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            examples:
              cuarto-de-pollo:
                value:
                  name: '1/4 de Pollo'
                  category: chicken
                  priceCents: 1850
              crema-gratis:
                value:
                  name: 'Ají'
                  category: sauce
                  priceCents: 0
      responses:
        '201':
          description: Producto creado
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              examples:
                respuesta:
                  value:
                    id: 5
                    name: '1/4 de Pollo'
                    category: chicken
                    priceCents: 1850
                    isActive: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ProductNameTaken'
        '500':
          $ref: '#/components/responses/InternalError'
  /products/{productId}:
    patch:
      operationId: updateProduct
      tags:
        - products
      summary: Edita nombre, categoría, precio o estado de un producto
      description: >-
        Roles permitidos: admin. Cambia el nombre (name), la categoría (category), el precio en
        céntimos (priceCents) o el estado (isActive) del producto indicado por productId, con al
        menos una propiedad en el cuerpo. isActive false lo quita de la carta y true lo devuelve;
        un producto nunca se borra. Renombrar a un nombre que ya existe (sin distinguir
        mayúsculas, activo o inactivo) responde 409 PRODUCT_NAME_TAKEN. Editar el precio no
        altera pedidos ya registrados: en la Fase 2 cada ítem copia el precio vigente al
        agregarse. Cabecera Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            examples:
              precio-nuevo:
                value:
                  priceCents: 1950
              desactivar:
                value:
                  isActive: false
      responses:
        '200':
          description: Producto actualizado
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              examples:
                desactivado:
                  value:
                    id: 7
                    name: 'Ají'
                    category: sauce
                    priceCents: 0
                    isActive: false
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          $ref: '#/components/responses/ProductNameTaken'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: polleria_session
      description: |
        Token de sesión aleatorio de 43 caracteres (base64url) que crea POST /auth/login. Cookie
        HttpOnly, SameSite=Strict, Path=/, Max-Age=57600, sin Secure (el local usa HTTP en la red).
  schemas:
    HealthStatus:
      type: string
      enum: [ok, error]
      description: ok si el componente responde; error si no.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, database, timestamp]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        database:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
          description: Hora del servidor en ISO 8601 UTC (con sufijo Z).
          examples: ['2026-10-07T20:00:00.000Z']
    UserRole:
      type: string
      enum: [waiter, kitchen, cashier, admin]
      description: Un rol. waiter = mozo, kitchen = cocina, cashier = cajero, admin = administrador.
    UserRoles:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items:
        $ref: '#/components/schemas/UserRole'
      description: |
        Roles de un usuario (revisión 1 de la spec 003): uno o varios, sin repetir. admin puede ir junto
        con otros roles. En las respuestas van siempre en el orden waiter, kitchen, cashier, admin.
      examples:
        - [waiter]
        - [waiter, cashier]
    Username:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{1,30}[a-z0-9]$'
      description: |
        Nombre de usuario guardado: de 3 a 32 caracteres, letras minúsculas sin tilde, números, punto,
        guion o guion bajo; empieza y termina con letra o número. Único.
      examples: [mozo.juan]
    Pin:
      type: string
      pattern: '^[0-9]{4,6}$'
      description: |
        PIN de 4 a 6 dígitos (texto, conserva los ceros a la izquierda). Nunca se devuelve.
        En las rutas de gestión (POST /users y POST /users/{userId}/pin, spec 004) además se
        rechazan los PIN fáciles de adivinar: dígitos repetidos, secuencias circulares
        ascendentes o descendentes (por ejemplo 1234, 4321, 9012, 0987), años entre 1900 y 2099,
        fechas DDMM o DDMMAA válidas y '2580'. El inicio de sesión no aplica esa regla.
      examples: ['2468']
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, pin]
      properties:
        username:
          type: string
          description: |
            Nombre de usuario tal como lo envía la web. La API lo recorta y lo pasa a minúsculas antes de
            validarlo contra el patrón de Username.
          examples: [mozo.juan]
        pin:
          $ref: '#/components/schemas/Pin'
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, roles]
      properties:
        id:
          type: integer
          minimum: 1
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Nombre que ve la gente (letras, números, espacios, punto, apóstrofo o guion).
          examples: [Juan]
        roles:
          $ref: '#/components/schemas/UserRoles'
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        expiresAt:
          type: string
          format: date-time
          description: Vencimiento de la sesión en ISO 8601 UTC (con sufijo Z); 16 horas después del inicio.
          examples: ['2026-10-09T07:00:00.000Z']
    LoginUser:
      type: object
      additionalProperties: false
      required: [username, displayName]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          type: string
          minLength: 1
          maxLength: 40
    LoginUsersResponse:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/LoginUser'
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, roles, isActive]
      description: Un usuario como lo ve el administrador (spec 004). Nunca incluye pin_hash.
      properties:
        id:
          type: integer
          minimum: 1
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Nombre que ve la gente (letras, números, espacios, punto, apóstrofo o guion).
          examples: [Rosa]
        roles:
          $ref: '#/components/schemas/UserRoles'
        isActive:
          type: boolean
          description: false = desactivado; no aparece en la lista de /auth/users y no puede iniciar sesión.
    UsersResponse:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, pin, roles]
      description: Alta de un usuario (spec 004). Nace activo.
      properties:
        username:
          type: string
          description: |
            Nombre de usuario tal como lo envía la web. La API lo recorta y lo pasa a minúsculas antes de
            validarlo contra el patrón de Username. No se puede cambiar después.
          examples: [rosa.cocina]
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Nombre que ve la gente. La API lo recorta y reduce espacios seguidos a uno.
          examples: [Rosa]
        pin:
          $ref: '#/components/schemas/Pin'
        roles:
          $ref: '#/components/schemas/UserRoles'
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Edición de un usuario (spec 004): al menos una propiedad. El nombre de usuario no se
        puede cambiar; el PIN se cambia solo por POST /users/{userId}/pin.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Nuevo nombre que ve la gente. La API lo recorta y reduce espacios seguidos a uno.
          examples: ['María P.']
        roles:
          $ref: '#/components/schemas/UserRoles'
        isActive:
          type: boolean
          description: false = desactivar (borra sus sesiones y limpia su conteo de intentos); true = reactivar (limpia el conteo).
    ResetPinRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin:
          $ref: '#/components/schemas/Pin'
    ProductCategory:
      type: string
      enum: [chicken, dish, drink, dessert, sauce, extra]
      description: |
        Categoría de la carta (spec 005), fija: chicken = pollo, dish = plato, drink = bebida,
        dessert = postre, sauce = crema, extra = extra (por ejemplo descartables con precio).
        El orden del enum es también el orden de las categorías en la carta. Las etiquetas en
        español las pone la web. 'combo' no es categoría todavía: los combos son la spec 007.
      examples: [chicken]
    ProductName:
      type: string
      minLength: 1
      maxLength: 60
      pattern: '^[\p{L}\p{N}][\p{L}\p{M}\p{N} .,''()/%+-]*$'
      description: |
        Nombre visible del producto ya normalizado: de 1 a 60 caracteres; empieza con letra o
        número y puede llevar letras con tilde, números, espacios, punto, coma, apóstrofo,
        paréntesis, barra, porcentaje, más o guion (por ejemplo "1/4 de Pollo", "Inca Kola 1.5 L").
        La API recorta espacios y normaliza Unicode antes de validar. Único sin distinguir
        mayúsculas.
      examples: ['1/4 de Pollo']
    PriceCents:
      type: integer
      minimum: 0
      maximum: 99999
      description: |
        Precio en céntimos de sol como entero (S/ 18.50 = 1850): entre 0 y 99999
        (S/ 0.00 a S/ 999.99). Nunca float ni texto. 0 es válido (por ejemplo cremas gratis).
      examples: [1850]
    Product:
      type: object
      additionalProperties: false
      required: [id, name, category, priceCents, isActive]
      description: |
        Un producto de la carta (spec 005). Nunca incluye createdAt ni updatedAt.
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/ProductName'
        category:
          $ref: '#/components/schemas/ProductCategory'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        isActive:
          type: boolean
          description: false = desactivado; no está en la carta vigente pero sigue en la lista completa y puede reactivarse.
    ProductsResponse:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, category, priceCents]
      description: Alta de un producto de la carta (spec 005). Nace activo.
      properties:
        name:
          $ref: '#/components/schemas/ProductName'
        category:
          $ref: '#/components/schemas/ProductCategory'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Edición de un producto (spec 005): al menos una propiedad. isActive false lo quita de la
        carta (desactivar) y true lo devuelve (reactivar); un producto nunca se borra.
      properties:
        name:
          $ref: '#/components/schemas/ProductName'
        category:
          $ref: '#/components/schemas/ProductCategory'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        isActive:
          type: boolean
          description: false = desactivar (sale de la carta); true = reactivar.
    ErrorCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]*$'
      description: |
        Código estable para que la web decida qué hacer. Códigos definidos hasta la spec 005:
        - NOT_FOUND (404): la ruta no existe.
        - INVALID_JSON (400): el cuerpo no es un JSON válido.
        - INVALID_BODY (400): el cuerpo no se pudo leer (compresión corrupta o incompleta, solicitud cortada).
        - VALIDATION_ERROR (400): los datos no cumplen el esquema; details.issues lista los problemas.
          En las rutas de gestión también se usa para un PIN fácil (issue en pin, mensaje
          'Ese PIN es muy fácil de adivinar. Elige otro.') y para un userId de ruta no válido.
        - PAYLOAD_TOO_LARGE (413): el cuerpo supera 100 KB (medido después de descomprimir).
        - UNSUPPORTED_MEDIA_TYPE (415): Content-Encoding distinto de identity, gzip, deflate y br, o charset no soportado.
        - INTERNAL_ERROR (500): error no controlado; nunca incluye detalles internos.
        - INVALID_CREDENTIALS (401, spec 003): usuario inexistente, inactivo o PIN incorrecto (siempre el mismo mensaje).
        - UNAUTHENTICATED (401, spec 003): la ruta exige sesión y no hay una válida (sin cookie, token inválido, sesión vencida o usuario desactivado).
        - FORBIDDEN (403, spec 003): la sesión es válida pero ninguno de los roles del usuario tiene permiso.
        - TOO_MANY_ATTEMPTS (429, spec 003): usuario bloqueado por intentos fallidos; details.retryAfterSeconds.
        - USERNAME_TAKEN (409, spec 003): el nombre de usuario ya existe (activo o inactivo). Lo usa POST /users (spec 004).
        - USER_NOT_FOUND (404, spec 004): el userId de la ruta no corresponde a ningún usuario.
        - LAST_ADMIN_REQUIRED (409, spec 004): la operación dejaría el sistema sin administradores activos.
        - PRODUCT_NOT_FOUND (404, spec 005): el productId de la ruta no corresponde a ningún producto.
        - PRODUCT_NAME_TAKEN (409, spec 005): ya existe un producto con ese nombre, sin distinguir
          mayúsculas, activo o inactivo. Lo usan POST /products y PATCH /products/{productId}.
        Las specs siguientes agregan códigos propios. Los clientes deben tolerar códigos desconocidos.
      examples: [NOT_FOUND]
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
          description: Ruta del campo con partes unidas por punto (por ejemplo items.0.quantity). Vacío si el problema es del cuerpo completo.
          examples: [name]
        message:
          type: string
          minLength: 1
          description: Explicación en español.
    ErrorDetails:
      description: |
        Información adicional del error, o null si no hay. En VALIDATION_ERROR es { issues }; en
        TOO_MANY_ATTEMPTS es { retryAfterSeconds }.
      oneOf:
        - type: 'null'
        - type: object
          additionalProperties: true
          properties:
            issues:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
            retryAfterSeconds:
              type: integer
              minimum: 1
              maximum: 900
              description: Segundos que faltan para que termine el bloqueo, redondeados hacia arriba.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              minLength: 1
              description: Mensaje en español de Perú, listo para mostrar al usuario.
            details:
              $ref: '#/components/schemas/ErrorDetails'
  headers:
    CacheControlNoStore:
      description: La respuesta no se guarda en caché.
      schema:
        type: string
        const: no-store
    SetSessionCookie:
      description: |
        Crea la cookie de sesión: polleria_session=<token de 43 caracteres>; Max-Age=57600; Path=/;
        Expires=<fecha>; HttpOnly; SameSite=Strict. Sin Secure ni Domain.
      schema:
        type: string
      example: polleria_session=Q2hpY2hhTW9yYWRhQ29uUG9sbG9BTGFCcmFzYTEyMzQ; Max-Age=57600; Path=/; Expires=Fri, 09 Oct 2026 07:00:00 GMT; HttpOnly; SameSite=Strict
    ClearSessionCookie:
      description: Borra la cookie de sesión (valor vacío y fecha en el pasado).
      schema:
        type: string
      example: polleria_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Strict
    RetryAfter:
      description: Segundos que faltan para poder intentar de nuevo (igual a details.retryAfterSeconds).
      schema:
        type: integer
        minimum: 1
        maximum: 900
      example: 900
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: |
        Identificador del usuario: solo dígitos, entero entre 1 y 2147483647 (entero de la base).
        Si no cumple, la ruta responde 400 VALIDATION_ERROR con un issue en 'userId'.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 3
    ProductId:
      name: productId
      in: path
      required: true
      description: |
        Identificador del producto: solo dígitos, entero entre 1 y 2147483647 (entero de la base).
        Si no cumple, la ruta responde 400 VALIDATION_ERROR con un issue en 'productId'
        (mensaje 'El identificador del producto no es válido.').
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 5
  responses:
    InvalidJson:
      description: El cuerpo de la solicitud no es un JSON válido. Aplica a cualquier ruta que reciba cuerpo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_JSON
              message: El cuerpo de la solicitud no es un JSON válido.
              details: null
    InvalidBody:
      description: |
        El cuerpo de la solicitud no se pudo leer: la compresión (gzip, deflate o br) está corrupta,
        incompleta o vacía, o la solicitud se cortó antes de terminar el cuerpo. Aplica a cualquier ruta
        que reciba cuerpo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_BODY
              message: No se pudo leer el cuerpo de la solicitud.
              details: null
    UnsupportedMediaType:
      description: |
        La codificación del cuerpo no es compatible: Content-Encoding distinto de identity, gzip, deflate
        y br (también varias codificaciones a la vez), o un charset que no es UTF o que no existe.
        Aplica a cualquier ruta que reciba cuerpo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: La codificación del cuerpo de la solicitud no es compatible.
              details: null
    ValidationError:
      description: Los datos enviados no cumplen el esquema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Los datos enviados no son válidos.
              details:
                issues:
                  - path: name
                    message: Debe tener al menos 1 carácter.
    NotFound:
      description: La ruta solicitada no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: La ruta solicitada no existe.
              details: null
    PayloadTooLarge:
      description: El cuerpo de la solicitud supera 100 KB (medido después de descomprimir).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: La solicitud es demasiado grande.
              details: null
    InvalidCredentials:
      description: |
        Usuario inexistente, usuario inactivo o PIN incorrecto. El cuerpo es siempre el mismo para no
        revelar la causa. No crea sesión ni envía Set-Cookie.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_CREDENTIALS
              message: Usuario o PIN incorrecto.
              details: null
    Unauthenticated:
      description: |
        La ruta exige sesión y no hay una válida: sin cookie, token inexistente o mal formado, sesión
        vencida o usuario desactivado. La web vuelve a /login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: Debes iniciar sesión para continuar.
              details: null
    Forbidden:
      description: |
        La sesión es válida pero ninguno de los roles del usuario tiene permiso para esta operación
        (requireRole). La usan las rutas /users (solo admin) y las escrituras de /products
        (POST y PATCH, solo admin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: No tienes permiso para realizar esta acción.
              details: null
    TooManyAttempts:
      description: |
        El usuario está bloqueado por intentos fallidos. Responde así aunque el PIN sea correcto, hasta
        que pasen los segundos indicados. No envía Set-Cookie.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOO_MANY_ATTEMPTS
              message: Demasiados intentos fallidos. Espera unos minutos e intenta de nuevo.
              details:
                retryAfterSeconds: 900
    InternalError:
      description: Error no controlado. No incluye el mensaje interno ni la traza.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Ocurrió un error inesperado. Intenta nuevamente.
              details: null
    UsernameTaken:
      description: El nombre de usuario ya existe, en un usuario activo o inactivo (spec 004).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: USERNAME_TAKEN
              message: Ese nombre de usuario ya existe.
              details: null
    UserNotFound:
      description: El userId de la ruta no corresponde a ningún usuario (spec 004).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: USER_NOT_FOUND
              message: Ese usuario no existe.
              details: null
    LastAdminRequired:
      description: |
        La operación dejaría el sistema sin administradores activos: quitar el rol admin del
        último administrador activo o desactivarlo (spec 004). El usuario queda sin cambios.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: LAST_ADMIN_REQUIRED
              message: Debe quedar al menos un administrador activo.
              details: null
    ProductNotFound:
      description: El productId de la ruta no corresponde a ningún producto (spec 005).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PRODUCT_NOT_FOUND
              message: Ese producto no existe.
              details: null
    ProductNameTaken:
      description: |
        Ya existe un producto con ese nombre, sin distinguir mayúsculas, activo o inactivo
        (spec 005). Nada quedó creado ni modificado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PRODUCT_NAME_TAKEN
              message: Ya existe un producto con ese nombre.
              details: null
